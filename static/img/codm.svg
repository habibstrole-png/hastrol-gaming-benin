<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1005"/>
      <stop offset="100%" stop-color="#2b1808"/>
    </linearGradient>
    <radialGradient id="codmGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E8112D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8112D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#codmBg)"/>
  <rect width="600" height="400" fill="url(#codmGlow)"/>

  <!-- grille tactique -->
  <g stroke="#FCD116" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="220" y1="0" x2="220" y2="400"/>
    <line x1="340" y1="0" x2="340" y2="400"/>
    <line x1="460" y1="0" x2="460" y2="400"/>
    <line x1="580" y1="0" x2="580" y2="400"/>
  </g>

  <!-- viseur central -->
  <g transform="translate(300,190)" stroke="#FCD116" stroke-width="2.5" fill="none" opacity="0.9">
    <circle r="70"/>
    <circle r="40" stroke-opacity="0.6"/>
    <line x1="-100" y1="0" x2="-85" y2="0"/>
    <line x1="100" y1="0" x2="85" y2="0"/>
    <line x1="0" y1="-100" x2="0" y2="-85"/>
    <line x1="0" y1="100" x2="0" y2="85"/>
    <circle r="3" fill="#E8112D" stroke="none"/>
  </g>

  <!-- silhouette casque tactique stylisée -->
  <g transform="translate(300,215)" fill="#0d0803">
    <path d="M -55 20 Q -60 -55 0 -68 Q 60 -55 55 20 Q 55 45 30 48 L -30 48 Q -55 45 -55 20 Z"/>
    <rect x="-58" y="-6" width="116" height="16" fill="#E8112D" opacity="0.85"/>
  </g>

  <text x="300" y="345" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#FCD116">CALL OF DUTY MOBILE</text>
  <text x="300" y="372" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-size="15" letter-spacing="6" fill="#f2d7a8" opacity="0.8">MODE BATTLE ROYALE &amp; MULTIJOUEUR</text>
</svg>
